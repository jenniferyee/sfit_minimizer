[project]
name = "sfit_minimizer"
description = "A. Gould's sfit gradient-type minimization algorithm"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = [
  "numpy",
  "matplotlib",
]

[project.optional-dependencies]
# The core minimizer does not need MulensModel; only the microlensing layer
# (sfit_minimizer.mm_funcs) operates on MulensModel Event objects.
mulens = ["MulensModel"]
test = ["pytest", "MulensModel"]

[build-system]
# setuptools >=77 for PEP 639 SPDX `license` / `license-files` support.
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

# The version comes from `git describe`, i.e. from the tags -- there is no
# version string to edit by hand. Pushing tag v1.0.3 builds 1.0.3; a commit
# after that tag builds 1.0.4.dev<N>+g<sha>. `version_file` is REGENERATED on
# every build, so source/sfit_minimizer/version.py is a build artifact and is
# gitignored rather than tracked.
#
# Consequence: a plain `git clone` has no version.py until something builds or
# installs the package, which is why __init__.py imports it defensively.
[tool.setuptools_scm]
version_file = "source/sfit_minimizer/version.py"

[tool.ruff]
# Identical to MMEXOFAST and EXOZIPPy so contributors moving between the three
# repositories get the same behaviour rather than three line lengths to
# remember. 79 matches the style this codebase was already written in.
line-length = 79

# ruff also formats Markdown code blocks and notebooks; neither is wanted here.
# build/ and the generated version.py are skipped automatically via .gitignore.
extend-exclude = ["*.md", "*.ipynb"]

[tool.ruff.lint]
# Deliberately narrow: error-class rules only, all of which pass as of this
# commit, so the hook goes in without a mass edit and without a single `# noqa`.
# Its job is to stop regressions, not to relitigate style. Same list as the
# sibling repos -- see MMEXOFAST's pyproject.toml for what each rule caught
# there and the measured counts for the rules left out (E501, F401).
select = [
    "E9", "F821", "F632", "F502", "F522", "F701", "F702", "B002", "PLE", "I",
]

[tool.ruff.lint.isort]
known-first-party = ["sfit_minimizer"]

[tool.ruff.lint.per-file-ignores]
# The star-import order in __init__.py is load-bearing: mm_funcs subclasses
# sfit_minimizer.SFitFunction at class-definition time, so sfit_classes has to
# populate the namespace first. Sorting them alphabetically -- which is exactly
# what `ruff check --fix` does, and what the pre-commit hook's `--fixable I`
# would do unprompted -- makes `import sfit_minimizer` raise AttributeError.
# Verified: it broke, which is why this entry exists.
"source/sfit_minimizer/__init__.py" = ["I001"]

[tool.setuptools]
package-dir = { "" = "source" }

[tool.setuptools.packages.find]
where = ["source"]
include = ["sfit_minimizer*"]

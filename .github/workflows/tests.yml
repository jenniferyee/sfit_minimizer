name: Tests

on:
  push:
    branches: [master]
  pull_request:
  # Callable from publish.yml so a release runs exactly this suite, rather than
  # a copy of it that drifts out of sync.
  workflow_call:

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Every interpreter `requires-python = ">=3.11"` claims, with no
        # fast/slow session split: the whole suite runs in ~7 s and matrix
        # combinations run concurrently, so breadth here is effectively free.
        # Keep this in sync with requires-python -- a version claimed there and
        # missing here is an untested claim.
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          # macOS on one interpreter, matching EXOZIPPy. Actions minutes are
          # free on public repositories, so the only cost is wall clock, and
          # these jobs run concurrently. It is the platform most likely to
          # differ for a matplotlib-importing package (backend selection) and
          # nothing here is Linux-specific.
          - os: macos-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      # uv installs the project itself in editable mode, which sfit_minimizer.DATA_PATH
      # relies on to locate the repo's data/ directory.
      - name: Run tests
        run: >
          uv run --extra test
          pytest -v source/sfit_minimizer/test

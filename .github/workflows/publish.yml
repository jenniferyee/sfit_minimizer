name: Publish

# sfit_minimizer is pure Python, so there are no per-platform binary wheels to
# build -- one sdist plus one py3-none-any wheel covers everything.
#
# Triggers:
#   push of a v* tag  -> build, verify, publish to PyPI, create a GitHub Release
#   workflow_dispatch -> build and verify only; optionally publish to TestPyPI
#
# Publishing uses PyPI Trusted Publishing (OIDC), so there is no API token in
# the repository secrets. The trust is registered ON PYPI against this exact
# combination and nothing else can use it:
#
#     owner/repo:    jenniferyee/sfit_minimizer
#     workflow:      publish.yml     <- this file's name; renaming it breaks
#                                       publishing until PyPI is updated too
#     environment:   (left blank)    <- deliberate; see below
#
# NO GITHUB ENVIRONMENT IS USED, unlike the equivalent workflow in EXOZIPPy.
# Environments are the only place deployment protection rules (required
# reviewers, wait timers, ref restrictions) can live, but they are created and
# configured under Settings -> Environments, which on a personal-account
# repository is owner-only -- and this repository is owned by a different person
# than the PyPI project. Bare environments with no rules attached would add a
# name to match and nothing else, so they are omitted entirely.
#
# TO ADD ONE LATER, IN THIS ORDER:
#   1. add `environment: {name: pypi, url: ...}` to the pypi job below. PyPI
#      ignores an environment claim it has not been configured with, so
#      releases keep working after this step alone.
#   2. only then set the environment name on the PyPI publisher config.
# The reverse order leaves a window where every release fails the OIDC check.
#
# NOTE: the PyPI project (sfit_minimizer) is owned by a different account than
# the one that owns this repository. That is supported -- PyPI only checks the
# owner/repo/workflow triple above -- but it means anyone who can push a v* tag
# here can publish a release there.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      testpypi:
        description: "Also publish the build to TestPyPI (rehearsal)"
        required: false
        type: boolean
        default: false

jobs:
  # The full test suite, gating the real PyPI upload below. Reused from
  # tests.yml via workflow_call rather than copied, so the release runs the
  # same suite CI runs and the two cannot drift.
  #
  # No `permissions:` block is needed here (unlike EXOZIPPy's equivalent): none
  # of tests.yml's jobs request more than the default read-only token. If a job
  # there ever asks for write access, this call must grant it explicitly or the
  # whole workflow fails at STARTUP, before any job runs.
  tests:
    uses: ./.github/workflows/tests.yml

  build:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 is required, not tidiness: setuptools-scm derives the
      # version from `git describe`, and a shallow clone has no tags to
      # describe against -- it would silently build 0.1.dev1 instead.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      # A rehearsal build cannot be uploaded as-is. Off a tag, setuptools-scm
      # derives something like "1.0.3.dev3+g9a10afa" from `git describe`, and
      # the "+<sha>" is a PEP 440 LOCAL VERSION, which PyPI and TestPyPI both
      # refuse:
      #
      #   400 The use of local versions in '...' is not allowed.
      #
      # Substituting a clean throwaway version on dispatch makes the last link
      # testable too. The !startsWith guard matters: dispatching this workflow
      # FROM a tag ref would otherwise substitute a throwaway version while the
      # "Version matches the tag" step below compared it against the tag,
      # failing with a mismatch that looks like a versioning bug rather than a
      # rehearsal.
      - name: Use a throwaway version for rehearsal builds
        if: >-
          github.event_name == 'workflow_dispatch' &&
          !startsWith(github.ref, 'refs/tags/')
        run: |
          echo "SETUPTOOLS_SCM_PRETEND_VERSION=1.0.3.dev${{ github.run_number }}" \
            >> "$GITHUB_ENV"

      - name: Build sdist and wheel
        run: uv build

      - name: Check the metadata
        run: uvx twine check dist/*

      # On a tag push, fail fast if the version the build derived does not match
      # the tag. Two tags on one commit make `git describe` pick between them
      # non-deterministically, so a release can build artifacts named for the
      # wrong version; PyPI versions can never be reused or replaced, so check
      # before uploading rather than after.
      - name: Version matches the tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          built=$(ls dist/*.tar.gz | sed -E 's|.*/sfit_minimizer-(.*)\.tar\.gz|\1|')
          echo "tag=$tag built=$built"
          if [ "$tag" != "$built" ]; then
            echo "::error::Tag $GITHUB_REF_NAME implies version '$tag' but the" \
                 "build produced '$built'. Refusing to publish. If two tags" \
                 "point at this commit, move the release tag to its own commit."
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*

  # Rehearsal target. TestPyPI needs its own trusted publisher registered
  # against this same workflow -- also with the environment field left blank.
  #
  # Deliberately gated on build only, NOT on tests: this exists to exercise the
  # publish plumbing quickly, and TestPyPI is disposable. The real upload below
  # is the one that must wait for a green suite.
  testpypi:
    needs: [build]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/

  # needs: tests as well as build -- a PyPI version can never be reused, so a
  # release must not be able to go out over a red suite.
  pypi:
    needs: [build, tests]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@v1.14.2

  # Pushing a tag publishes to PyPI but does NOT create a GitHub Release -- that
  # is a separate object -- so the Releases page silently falls behind the tags.
  # Create it here from the annotated tag's own message so the two never
  # diverge. Tags containing a/b/rc are marked as pre-releases.
  github_release:
    needs: [pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          # Body = the annotated tag message minus its first line (the title).
          git tag -l "$tag" --format='%(contents)' | tail -n +2 > notes.md
          prerelease=""
          case "$tag" in
            *a*|*b*|*rc*) prerelease="--prerelease" ;;
          esac
          gh release create "$tag" --verify-tag --title "$tag" \
            --notes-file notes.md $prerelease dist/*

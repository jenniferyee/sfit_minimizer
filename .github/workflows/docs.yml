name: Docs

# Rebuilds the Sphinx site and commits the generated HTML back into docs/.
#
# WHY COMMIT BUILD OUTPUT: GitHub Pages for this repo is configured in "legacy"
# mode, serving the docs/ folder of master directly (verified via the Pages
# API: build_type=legacy, source={branch: master, path: /docs}). Switching to
# the cleaner "build and deploy from a workflow" mode -- where nothing
# generated needs to live in git -- requires changing Settings -> Pages ->
# Source, which is owner-only on a personal-account repository. Until that
# happens, regenerating in CI and committing is what keeps the published site
# in sync with the docstrings.
#
# NO INFINITE LOOP, for two independent reasons:
#   1. pushes made with GITHUB_TOKEN do not trigger further workflow runs; and
#   2. the paths filter below watches docs/SOURCE, never docs/ output, so this
#      workflow's own commit could not match it even if (1) changed.
on:
  push:
    branches: [master]
    paths:
      - "source/**"
      - "docs/source/**"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"
    tags:
      - "v*"
  workflow_dispatch:

# Two pushes in quick succession would otherwise race to commit to master.
concurrency:
  group: docs
  cancel-in-progress: false

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      # fetch-depth: 0 because conf.py reads the installed version, which
      # setuptools-scm derives from `git describe` -- a shallow clone has no
      # tags and the docs would be stamped 0.1.dev1.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      # Flags, in order:
      #   -n  nitpicky: report cross-references that do not resolve. These
      #       docstrings lean on :py:func:/:py:attr:/:py:class: heavily, and
      #       without this a reference to a renamed function silently renders
      #       as plain text instead of a link.
      #   -W  turn warnings into errors. The default warnings are the ones that
      #       matter most: malformed RST in a docstring (which renders wrong on
      #       the public site rather than failing), a page missing from every
      #       toctree, and -- worst -- an autodoc import failure, which
      #       otherwise "succeeds" while publishing an EMPTY page.
      #   --keep-going  report every problem in one run instead of stopping at
      #       the first, so fixing three warnings takes one run, not three.
      #
      # Both -n and -W passed with zero warnings when this was enabled, which
      # is unusual for nitpicky mode; it works here because the docstrings
      # write types as italics (*np.array*) rather than as reference roles.
      #
      # -d keeps Sphinx's doctree cache out of the output directory; it is
      # build state, not part of the published site, and it used to be tracked
      # (a binary pickle that churned on every rebuild).
      - name: Build the site
        run: >
          uv run --extra docs
          sphinx-build -n -W --keep-going
          -b html -d "${RUNNER_TEMP}/doctrees" docs/source docs

      - name: Commit the rebuilt site
        run: |
          set -euo pipefail
          if git diff --quiet -- docs; then
            echo "Docs already up to date; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -m "Rebuild the documentation site

          Generated by .github/workflows/docs.yml from ${GITHUB_SHA}."
          # Another push may have landed while Sphinx was running.
          git pull --rebase --autostash origin master
          git push origin HEAD:master

name: Lint

# The pre-commit hook only protects people who ran `pre-commit install`, so the
# same check runs here too. Contributions from forks get checked either way.
#
# Kept separate from tests.yml so a lint failure is distinguishable from a test
# failure at a glance.
#
# NOTE: there is no `ruff format --check` step yet, unlike MMEXOFAST's otherwise
# identical workflow. Adding one requires reformatting first -- measured at 11
# of 14 files and ~1210 lines on this tree -- which is a decision about
# churning a repository owned by someone else, not a CI question. When that
# reformat lands, add the step below and record the commit in
# .git-blame-ignore-revs:
#
#     - name: ruff format
#       run: uvx ruff@0.16.0 format --check --diff .
on:
  push:
    branches: [master]
  pull_request:

jobs:
  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      # Version pinned to match .pre-commit-config.yaml exactly. If these two
      # drift, CI and the hook disagree and every PR fights the difference.
      - name: ruff check
        run: uvx ruff@0.16.0 check --output-format github .

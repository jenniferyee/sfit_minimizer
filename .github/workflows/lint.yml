name: Lint

# The pre-commit hook only protects people who ran `pre-commit install`, so the
# same check runs here too. Contributions from forks get checked either way.
#
# Kept separate from tests.yml so a formatting failure is distinguishable from
# a test failure at a glance.
on:
  push:
    branches: [master]
  pull_request:

jobs:
  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      # Version pinned to match .pre-commit-config.yaml exactly. If these two
      # drift, CI and the hook disagree and every PR fights the difference.
      # ruff check runs BEFORE ruff format: the linter's import sorting (rule
      # `I`) decides which lines exist, the formatter decides how they wrap.
      - name: ruff check
        run: uvx ruff@0.16.0 check --output-format github .

      - name: ruff format
        run: uvx ruff@0.16.0 format --check --diff .
